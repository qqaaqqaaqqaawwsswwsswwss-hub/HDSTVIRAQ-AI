plugins { id 'com.android.application' }

android {
    namespace 'com.mdr.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mdr.app'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName "3.2.0"
    }
    buildFeatures {
        // AGP 8 disables BuildConfig generation by default. AppActivity uses BuildConfig.DEBUG.
        buildConfig true
    }
    buildTypes {
        debug { }
        release { minifyEnabled false; shrinkResources false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.18.0"
}
