name: Android APKs

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify source and build Standard + Pro APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS tooling and verify
        run: npm ci && npm run verify

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.14.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.8

      - name: Build both debug APK editions
        run: gradle --no-daemon assembleStandardDebug assembleProDebug

      - name: Verify APK outputs
        run: |
          test -s app/build/outputs/apk/standard/debug/app-standard-debug.apk
          test -s app/build/outputs/apk/pro/debug/app-pro-debug.apk

      - name: Upload Standard APK
        uses: actions/upload-artifact@v4
        with:
          name: MDR-Platform-3.2.0-Standard-APK
          path: app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: MDR-Platform-3.2.0-Pro-APK
          path: app/build/outputs/apk/pro/debug/app-pro-debug.apk
          if-no-files-found: error
          retention-days: 30
